services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: julius
      POSTGRES_PASSWORD: julius
      POSTGRES_DB: julius
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U julius"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
